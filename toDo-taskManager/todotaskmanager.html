<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="style/css/default.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        >
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="taskWrapper ">
                        <div class="sectionWrapper">
                            <div class="sectionWrapper__title">
                                ToDo List
                            </div>
                            <div class="sectionWrapper__name">
                                <input type="text" placeholder="Enter Task Name" id="taskInput">
                            </div>
                            <div class="sectionWrapper__option">
                                <select name="Select Priority" id="selectPriority">
                                    <option class="sectionWrapper__option--low" value="" hidden>Select Priority</option>
                                    <option class="sectionWrapper__option--low" value="Low">Low</option>
                                    <option class="sectionWrapper__option--medium" value="Medium">Medium</option>
                                    <option class="sectionWrapper__option--high" value="High">High</option>
                                </select>
                            </div>
                            <button class="sectionWrapper__actionBtn" id="addTaskBtn">Add Task</button>
                            <div class="sectionWrapper__search">
                                <input type="search" placeholder="Search tasks..." id="searchInput">
                            </div>
                           <div class="sectionWrapper__tasklist" id="taskList"></div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/todotaskmanager.js">
            
        </script>
    </body>
</html>
